name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-lint-and-test:
    name: Rust (Lint & Test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Swift package (for dylib)
        run: swift build --package-path swift/ -c release

      - name: Copy dylib to target/swift-libs for Rust linking
        run: |
          mkdir -p target/swift-libs
          cp swift/.build/release/libTinyBridgeVZBridge.dylib target/swift-libs/

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # tinybridge-vz's and tinybridge-daemon's tests link against the real
      # Virtualization.framework bridge dylib built above; DYLD_LIBRARY_PATH makes the
      # linker/loader find it at test-binary runtime. The 9 tinybridge-daemon tests
      # (device access policy, OKF updater, error-code-mapping) that were previously
      # skipped here as "known pre-existing failures" now pass -- verified locally,
      # all 194/194 -- so they're no longer excluded.
      - name: Run workspace tests
        run: cargo test --workspace --verbose
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/swift-libs

      # `cargo test` only guarantees building the hashed `--test` harness
      # binary for tinybridge-vmhost (it has `#[cfg(test)] mod tests` inline
      # in main.rs) -- it does not reliably leave the plain, unhashed
      # `target/debug/tinybridge-vmhost` binary the codesign step below
      # needs. Build it explicitly rather than assuming a side effect of
      # the test step above.
      - name: Build tinybridge-vmhost binary
        run: cargo build --bin tinybridge-vmhost

      - name: Codesign tinybridge-vmhost with the virtualization entitlement
        run: |
          codesign --force --sign - \
            --entitlements crates/tinybridge-vmhost/tinybridge-vmhost.entitlements \
            target/debug/tinybridge-vmhost
          codesign -d --entitlements - target/debug/tinybridge-vmhost

  verify-assets:
    name: Verify Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check sample-env.yaml exists
        run: |
          test -f assets/sample-env.yaml || exit 1
          cat assets/sample-env.yaml

      - name: Validate YAML syntax
        run: |
          if command -v yamllint &> /dev/null; then
            yamllint assets/sample-env.yaml
          else
            echo "yamllint not available, skipping detailed validation"
          fi
