name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-lint-and-test:
    name: Rust (Lint & Test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Swift package (for dylib)
        run: swift build --package-path swift/ -c release

      - name: Copy dylib to target/swift-libs for Rust linking
        run: |
          mkdir -p target/swift-libs
          cp swift/.build/release/libTinyBridgeVZBridge.dylib target/swift-libs/ || true

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests (skip daemon and VZ)
        run: |
          cargo test -p tinybridge-cli --verbose
          cargo test -p tinybridge-core --verbose
          cargo test -p tinybridge-clipboard --verbose
          cargo test -p tinybridge-ssh --verbose
          cargo test -p tinybridge-dns --verbose
          cargo test -p tinybridge-devices --verbose
          cargo test -p tinybridge-dds --verbose
        env:
          SKIP_VZ_TESTS: "1"

  verify-assets:
    name: Verify Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check sample-env.yaml exists
        run: |
          test -f assets/sample-env.yaml || exit 1
          cat assets/sample-env.yaml

      - name: Validate YAML syntax
        run: |
          if command -v yamllint &> /dev/null; then
            yamllint assets/sample-env.yaml
          else
            echo "yamllint not available, skipping detailed validation"
          fi
