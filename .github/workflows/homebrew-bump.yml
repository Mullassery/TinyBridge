name: Homebrew bump

# When a tinybridge release is published, compute the tarball's sha256 and
# dispatch a `tinybridge-release` event at homebrew-tinybridge, which bumps
# Formula/tinybridge.rb automatically.
#
# Requires a `HOMEBREW_BUMP_TOKEN` repo secret: a fine-grained PAT (or GitHub
# App token) with `contents: write` on Mullassery/homebrew-tinybridge. The
# default GITHUB_TOKEN cannot dispatch to another repository.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump Homebrew to (e.g. v0.6.3)"
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Skip non-version tags
        id: guard
        run: |
          if ! printf '%s' "${{ steps.tag.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::notice::tag '${{ steps.tag.outputs.tag }}' is not a version tag; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute tarball sha256
        if: steps.guard.outputs.skip == 'false'
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="$(gh release view "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' | grep -E 'aarch64-apple-darwin\.tar\.gz$' | head -1)"
          if [ -z "$ASSET" ]; then
            echo "::error::no aarch64 tarball asset on ${{ steps.tag.outputs.tag }}"
            exit 1
          fi
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern "$ASSET" --dir dist --clobber
          SHA="$(shasum -a 256 "dist/$ASSET" | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$ASSET → $SHA"

      - name: Dispatch to homebrew-tinybridge
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_BUMP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_BUMP_TOKEN secret is not set"
            exit 1
          fi
          gh api repos/Mullassery/homebrew-tinybridge/dispatches \
            --method POST \
            -f event_type=tinybridge-release \
            -f "client_payload[version]=${{ steps.tag.outputs.version }}" \
            -f "client_payload[sha256]=${{ steps.sha.outputs.sha256 }}"
          echo "Dispatched homebrew bump for ${{ steps.tag.outputs.version }}"
