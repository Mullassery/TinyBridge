[workspace]
resolver = "2"
members = [
    "crates/tinybridge-core",
    "crates/tinybridge-cli",
    "crates/tinybridge-daemon",
    "crates/tinybridge-diagnostics",
    "crates/tinybridge-template-engine",
    "crates/tinybridge-error",
    "crates/tinybridge-vz-sys",
    "crates/tinybridge-vz",
    "crates/tinybridge-router",
    "crates/tinybridge-clipboard",
    "crates/tinybridge-ssh",
    "crates/tinybridge-templates",
    "crates/tinybridge-tunnel",
    "crates/tinybridge-dns",
    "crates/tinybridge-snapshots",
    "crates/tinybridge-devices",
    "crates/tinybridge-dds",
]

[workspace.package]
version       = "0.2.0"
edition       = "2021"
rust-version  = "1.87"
authors       = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license       = "Apache-2.0"
repository    = "https://github.com/Mullassery/tinybridge"

[workspace.dependencies]
tokio              = { version = "1.40", features = ["full"] }
clap               = { version = "4.5", features = ["derive", "env", "color"] }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
serde_yaml         = "0.9"
anyhow             = "1.0"
thiserror          = "2.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-util         = { version = "0.7", features = ["codec"] }
bytes              = "1.7"
portable-pty       = "0.8"
crossterm          = "0.28"
indicatif          = "0.17"
console            = "0.15"
dirs               = "5.0"
semver             = { version = "1.0", features = ["serde"] }
uuid               = { version = "1.10", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
futures            = "0.3"
bindgen            = "0.70"
goblin             = "0.8"
lru                = "0.12"
tempfile           = "3.8"
ssh-key            = { version = "0.6", features = ["ed25519", "encryption"] }
regex              = "1.10"
handlebars         = "5.0"
sha2               = "0.10"
hex                = "0.4"
parking_lot        = "0.12"
tinybridge-core              = { path = "crates/tinybridge-core" }
tinybridge-cli               = { path = "crates/tinybridge-cli" }
tinybridge-daemon            = { path = "crates/tinybridge-daemon" }
tinybridge-diagnostics       = { path = "crates/tinybridge-diagnostics" }
tinybridge-template-engine   = { path = "crates/tinybridge-template-engine" }
tinybridge-error             = { path = "crates/tinybridge-error" }
tinybridge-dds               = { path = "crates/tinybridge-dds" }
tinybridge-vz-sys            = { path = "crates/tinybridge-vz-sys" }
tinybridge-vz                = { path = "crates/tinybridge-vz" }
tinybridge-router            = { path = "crates/tinybridge-router" }
tinybridge-clipboard         = { path = "crates/tinybridge-clipboard" }
tinybridge-ssh        = { path = "crates/tinybridge-ssh" }
tinybridge-templates  = { path = "crates/tinybridge-templates" }
tinybridge-tunnel     = { path = "crates/tinybridge-tunnel" }
tinybridge-dns        = { path = "crates/tinybridge-dns" }
tinybridge-snapshots  = { path = "crates/tinybridge-snapshots" }
tinybridge-devices    = { path = "crates/tinybridge-devices" }

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
