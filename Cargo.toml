[workspace]
resolver = "2"
members = [
    "crates/tinybridge-core",
    "crates/tinybridge-cli",
    "crates/tinybridge-daemon",
]

# Week 3: tinybridge-vz-sys, tinybridge-vz

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.87"
authors       = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license       = "Apache-2.0"
repository    = "https://github.com/Mullassery/tinybridge"

[workspace.dependencies]
tokio              = { version = "1.40", features = ["full"] }
clap               = { version = "4.5", features = ["derive", "env", "color"] }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
serde_yaml         = "0.9"
anyhow             = "1.0"
thiserror          = "2.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-util         = { version = "0.7", features = ["codec"] }
bytes              = "1.7"
portable-pty       = "0.8"
crossterm          = "0.28"
indicatif          = "0.17"
console            = "0.15"
dirs               = "5.0"
semver             = { version = "1.0", features = ["serde"] }
uuid               = { version = "1.10", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
futures            = "0.3"
bindgen            = "0.70"
tinybridge-core    = { path = "crates/tinybridge-core" }
tinybridge-cli     = { path = "crates/tinybridge-cli" }
tinybridge-daemon  = { path = "crates/tinybridge-daemon" }
# tinybridge-vz-sys (Week 3) and tinybridge-vz (Week 3) added when crates created

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
