[package]
name    = "tinybridge-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tinybridged"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
clap               = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tinybridge-core      = { workspace = true }
tinybridge-dds       = { workspace = true }
tinybridge-vz        = { workspace = true }
tinybridge-clipboard = { workspace = true }
tinybridge-ssh       = { workspace = true }
anyhow             = { workspace = true }
uuid               = { workspace = true, features = ["v4"] }
chrono             = { workspace = true }
futures            = { workspace = true }
dirs               = { workspace = true }
parking_lot        = { version = "0.12" }
# OTel dependencies for Phase 2 (framework added, full implementation in progress)
# opentelemetry       = { version = "0.24", features = ["trace", "metrics"] }
# opentelemetry-http  = { version = "0.13" }
# opentelemetry-otlp  = { version = "0.17", features = ["trace", "metrics", "http-proto"] }
# tracing-opentelemetry = { version = "0.25", features = ["metrics"] }
