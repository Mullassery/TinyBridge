[package]
name    = "tinybridge-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tinybridged"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
clap               = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tinybridge-core      = { workspace = true }
tinybridge-vz        = { workspace = true }
tinybridge-clipboard = { workspace = true }
tinybridge-ssh       = { workspace = true }
anyhow             = { workspace = true }
uuid               = { workspace = true, features = ["v4"] }
chrono             = { workspace = true }
futures            = { workspace = true }
dirs               = { workspace = true }
# OTel dependencies for Phase 2 (deferred for now to keep Phase 1 minimal)
# opentelemetry      = { version = "0.22", features = ["trace", "metrics"] }
# opentelemetry-jaeger = { version = "0.21", features = ["rt-tokio"] }
# tracing-opentelemetry = "0.22"
